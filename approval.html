<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Approval — MindGraph AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f0f4f9;
      color: #1e2a3a;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2.5rem 1rem 4rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(20, 40, 80, 0.10), 0 1px 4px rgba(20, 40, 80, 0.06);
      padding: 2.5rem 2.5rem 2rem;
      width: 100%;
      max-width: 620px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
      color: #4a6a9c;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .brand svg { flex-shrink: 0; }
    h1 { margin: 0 0 0.4rem; font-size: 1.45rem; line-height: 1.25; color: #111827; }
    .subtitle { margin: 0 0 1.8rem; color: #5a6f88; font-size: 0.95rem; }
    .section { margin-bottom: 1.5rem; }
    .section-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7a90aa;
      margin-bottom: 0.5rem;
    }
    .message-box {
      padding: 0.9rem 1.1rem;
      background: #f4f8fd;
      border: 1px solid #d6e4f0;
      border-left: 4px solid #3a72b5;
      border-radius: 8px;
      font-size: 0.92rem;
      line-height: 1.55;
      color: #253045;
      white-space: pre-wrap;
    }
    .context-box {
      background: #f8fafc;
      border: 1px solid #dde5ef;
      border-radius: 8px;
      padding: 0.9rem 1.1rem;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.78rem;
      line-height: 1.6;
      color: #2a3a50;
      overflow-x: auto;
      max-height: 280px;
      overflow-y: auto;
      white-space: pre;
    }
    textarea {
      width: 100%;
      border: 1px solid #c8d6e8;
      border-radius: 8px;
      padding: 0.72rem 0.9rem;
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      color: #1e2a3a;
      outline: none;
      transition: border-color 120ms;
    }
    textarea:focus { border-color: #3a72b5; box-shadow: 0 0 0 3px rgba(58, 114, 181, 0.12); }
    .actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.8rem;
    }
    .btn {
      flex: 1;
      padding: 0.78rem 1rem;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: filter 120ms, transform 80ms;
      letter-spacing: 0.01em;
    }
    .btn:hover { filter: brightness(1.05); }
    .btn:active { transform: scale(0.98); }
    .btn-approve { background: #1f7040; color: #fff; }
    .btn-reject  { background: #c13234; color: #fff; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .status-banner {
      display: none;
      padding: 1.1rem 1.4rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      margin-top: 1.5rem;
      text-align: center;
    }
    .status-banner.success-approve { background: #e9f8ef; color: #145a30; border: 1px solid #b3dcc4; display: block; }
    .status-banner.success-reject  { background: #fdeeed; color: #8a2328; border: 1px solid #f0b8bb; display: block; }
    .status-banner.error { background: #fff3e0; color: #7a4300; border: 1px solid #f5d99a; display: block; }
    .token-note {
      margin-top: 2rem;
      padding-top: 1.2rem;
      border-top: 1px solid #e8eef5;
      font-size: 0.74rem;
      color: #8a9ab0;
    }
    .token-note code {
      background: #f0f4f9;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.72rem;
    }
    .local-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.71rem;
      font-weight: 600;
      background: #e8f4e8;
      color: #1f6030;
      border: 1px solid #b3dcc4;
      border-radius: 5px;
      padding: 0.15rem 0.45rem;
      margin-left: 0.4rem;
    }
    .loading { color: #7a90aa; font-size: 0.95rem; padding: 1rem 0; }
    .error-text { color: #c13234; font-size: 0.9rem; }
  </style>
</head>
<body>
<div class="card" id="app">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="4" width="56" height="56" rx="14" fill="#1e4d86"/>
      <text x="32" y="39" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">MG</text>
    </svg>
    MindGraph AI
    <span class="local-badge">⚡ Local</span>
  </div>
  <p class="loading" id="loading-msg">Loading checkpoint details…</p>
  <div id="content" style="display:none">
    <h1 id="cp-title">Approval Required</h1>
    <p class="subtitle" id="cp-subtitle">Review the request below and approve or reject.</p>

    <div class="section" id="message-section" style="display:none">
      <div class="section-label">Reviewer Message</div>
      <div class="message-box" id="cp-message"></div>
    </div>

    <div class="section" id="context-section" style="display:none">
      <div class="section-label">Incoming Context</div>
      <div class="context-box" id="cp-context"></div>
    </div>

    <div class="section">
      <div class="section-label">Your Comment (optional)</div>
      <textarea id="cp-comment" rows="3" placeholder="Add a note — it will appear in the audit log…"></textarea>
    </div>

    <div class="actions">
      <button class="btn btn-approve" id="btn-approve">✓ Approve</button>
      <button class="btn btn-reject"  id="btn-reject">✗ Reject</button>
    </div>

    <div class="status-banner" id="status-banner"></div>

    <div class="token-note">
      Checkpoint token: <code id="cp-token-display"></code><br/>
      Decisions are stored in your browser and synced to the running workflow automatically.
    </div>
  </div>
</div>

<script type="module">
  // ── IndexedDB helpers ────────────────────────────────────────────────────
  const DB_NAME    = "mindgraph-checkpoints";
  const DB_VERSION = 1;
  const STORE_NAME = "checkpoints";
  const CHANNEL    = "mindgraph-checkpoint-decisions";

  const openDb = () => new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (ev) => {
      const db = ev.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const s = db.createObjectStore(STORE_NAME, { keyPath: "token" });
        s.createIndex("status",    "status",    { unique: false });
        s.createIndex("createdAt", "createdAt", { unique: false });
      }
    };
    req.onsuccess = (ev) => resolve(ev.target.result);
    req.onerror   = (ev) => reject(ev.target.error);
  });

  const idbGet = async (token) => {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx    = db.transaction(STORE_NAME, "readonly");
      const req   = tx.objectStore(STORE_NAME).get(token);
      req.onsuccess = () => { db.close(); resolve(req.result ?? null); };
      req.onerror   = () => { db.close(); reject(req.error); };
    });
  };

  const idbPut = async (record) => {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx  = db.transaction(STORE_NAME, "readwrite");
      const req = tx.objectStore(STORE_NAME).put(record);
      tx.oncomplete = () => { db.close(); resolve(req.result); };
      tx.onerror    = () => { db.close(); reject(tx.error); };
    });
  };

  // ── UI helpers ───────────────────────────────────────────────────────────
  const qs         = new URLSearchParams(location.search);
  const token      = qs.get("token") ?? "";
  const $          = (id) => document.getElementById(id);
  const loadingMsg = $("loading-msg");
  const content    = $("content");
  const banner     = $("status-banner");

  const showBanner = (msg, cls) => {
    banner.textContent = msg;
    banner.className = `status-banner ${cls}`;
  };

  // ── Boot ─────────────────────────────────────────────────────────────────
  if (!token) {
    loadingMsg.textContent = "Missing token parameter. URL should be: approval.html?token=chk_xxx";
    loadingMsg.className = "error-text";
  } else {
    loadAsync();
  }

  // ── Retry helper — the main app writes IDB asynchronously, so we may
  //    arrive before the record exists. Poll briefly before giving up.
  async function waitForRecord(token, attempts = 12, intervalMs = 300) {
    for (let i = 0; i < attempts; i++) {
      const rec = await idbGet(token);
      if (rec) return rec;
      await new Promise(r => setTimeout(r, intervalMs));
    }
    return null;
  }

  async function loadAsync() {
    try {
      const cp = await waitForRecord(token);
      if (!cp) {
        throw new Error(
          "Checkpoint not found in local storage. " +
          "Make sure you opened this link from the same browser where MindGraph is running."
        );
      }

      $("cp-title").textContent = cp.nodeLabel ?? "Approval Required";
      $("cp-subtitle").textContent =
        `Workflow: ${cp.graphTitle ?? "Untitled"} · ` +
        `Reached at ${new Date(cp.createdAt).toLocaleString()}`;
      $("cp-token-display").textContent = token;

      if (cp.message) {
        $("cp-message").textContent = cp.message;
        $("message-section").style.display = "block";
      }

      if (cp.inputPayload != null) {
        try {
          const src = typeof cp.inputPayload === "string"
            ? JSON.parse(cp.inputPayload) : cp.inputPayload;
          $("cp-context").textContent = JSON.stringify(src, null, 2);
          $("context-section").style.display = "block";
        } catch {
          $("cp-context").textContent = String(cp.inputPayload);
          $("context-section").style.display = "block";
        }
      }

      if (cp.status !== "pending") {
        const isApproved = cp.status === "approved";
        showBanner(
          isApproved
            ? `✓ Already approved by ${cp.decidedBy ?? "someone"}.`
            : `✗ Already rejected by ${cp.decidedBy ?? "someone"}.`,
          isApproved ? "success-approve" : "success-reject"
        );
        $("btn-approve").disabled = true;
        $("btn-reject").disabled  = true;
      } else {
        $("btn-approve").addEventListener("click", () => decide("approve"));
        $("btn-reject").addEventListener("click",  () => decide("reject"));
      }

      loadingMsg.style.display = "none";
      content.style.display    = "block";
    } catch (err) {
      loadingMsg.textContent = `Error: ${err.message}`;
      loadingMsg.className   = "error-text";
    }
  }

  async function decide(action) {
    const comment    = $("cp-comment").value.trim();
    const decidedAt  = new Date().toISOString();
    const decidedBy  = "reviewer";
    const approved   = action === "approve";

    $("btn-approve").disabled = true;
    $("btn-reject").disabled  = true;

    try {
      // Fetch current record so we overwrite the correct version
      const existing = await idbGet(token);
      if (!existing) throw new Error("Checkpoint record disappeared from local storage.");

      const updated = {
        ...existing,
        status: approved ? "approved" : "rejected",
        decidedBy,
        decidedAt,
        decisionComment: comment || null
      };

      await idbPut(updated);

      // Notify the main-app tab via BroadcastChannel
      try {
        const ch = new BroadcastChannel(CHANNEL);
        ch.postMessage({ type: "checkpoint_decision", token, approved, comment, decidedBy, decidedAt });
        ch.close();
      } catch {
        // BroadcastChannel unavailable — decision is still stored in IDB,
        // the main app will read it when the user returns to the tab.
      }

      showBanner(
        approved
          ? "✓ Approved — the workflow will continue."
          : "✗ Rejected — the workflow has been stopped at this checkpoint.",
        approved ? "success-approve" : "success-reject"
      );
    } catch (err) {
      showBanner(`Failed to save decision: ${err.message}`, "error");
      $("btn-approve").disabled = false;
      $("btn-reject").disabled  = false;
    }
  }
</script>
</body>
</html>
